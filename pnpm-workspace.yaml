packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # Keep PostCSS and image processing on patched versions.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '^0.35.5'

  # Patch vulnerable transitive dependencies without changing their major lines.
  'js-yaml@^4': '^4.3.2'
  'js-yaml@^3': '^3.15.2'
  'nanoid@^3': '^3.3.20'
  'brace-expansion@^1': '^1.1.20'
  'brace-expansion@^2': '^2.1.6'
  'brace-expansion@^5': '^5.0.11'
  'proxy-addr': '^2.0.8'
  '@grpc/grpc-js@^1': '^1.14.6'
  '@fastify/busboy': '^3.2.4'
  'source-map-js': '^1.2.2'
  'body-parser@^1': '^1.20.9'
  'body-parser@^2': '^2.4.0'

  'qs@^6': '^6.16.1'
  'ip-address@^10': '^10.7.4'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
